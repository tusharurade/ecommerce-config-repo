server:
  port: 8081

spring:
    application:
        name: productservice

  data:
    mongodb:
      uri: mongodb://localhost:27017/ECommerceDb

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

  management:
    endpoints:
      web:
        exposure:
          include: health,info