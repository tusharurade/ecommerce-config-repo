server:
  port: 8086

spring:
  application:
    name: payment-service
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=EmployeeDb;encrypt=true;trustServerCertificate=true
    username: springuser
    password: Spring@123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect