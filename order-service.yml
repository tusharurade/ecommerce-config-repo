server:
  port: 8083

spring:
  application:
    name: order-service
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=OrderDb;encrypt=true;trustServerCertificate=true;integratedSecurity=true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect