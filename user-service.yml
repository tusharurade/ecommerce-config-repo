server:
  port: 8082

spring:
  application:
    name: user-service
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=ECommerceDb;encrypt=true;trustServerCertificate=true
    username: springuser
    password: Spring@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh